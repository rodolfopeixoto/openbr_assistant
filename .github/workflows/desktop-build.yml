name: Build Desktop App

on:
  push:
    branches: [ develop, main ]
    tags: [ 'v*' ]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-build.yml'
  pull_request:
    branches: [ develop, main ]
    paths:
      - 'apps/desktop/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      
      - name: Install dependencies
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
      
      - name: Build (ARM64)
        working-directory: apps/desktop/src-tauri
        run: cargo build --release --target aarch64-apple-darwin
        
      - name: Build (x86_64)
        working-directory: apps/desktop/src-tauri
        run: cargo build --release --target x86_64-apple-darwin
        
      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: openbr-desktop-macos-arm64
          path: apps/desktop/src-tauri/target/aarch64-apple-darwin/release/openbr-desktop
          if-no-files-found: error
          
      - name: Upload x86_64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: openbr-desktop-macos-x86_64
          path: apps/desktop/src-tauri/target/x86_64-apple-darwin/release/openbr-desktop
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf
      
      - name: Build
        working-directory: apps/desktop/src-tauri
        run: cargo build --release
        
      - name: Build .deb package
        working-directory: apps/desktop/src-tauri
        run: |
          cargo install cargo-deb
          cargo deb --no-build
        continue-on-error: true
        
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: openbr-desktop-linux
          path: apps/desktop/src-tauri/target/release/openbr-desktop
          if-no-files-found: error
          
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: openbr-desktop-linux-deb
          path: apps/desktop/src-tauri/target/debian/*.deb
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build
        working-directory: apps/desktop/src-tauri
        run: cargo build --release
        
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: openbr-desktop-windows
          path: apps/desktop/src-tauri/target/release/openbr-desktop.exe
          if-no-files-found: error

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev
      
      - name: Check formatting
        working-directory: apps/desktop/src-tauri
        run: cargo fmt -- --check
        
      - name: Run clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings
        
      - name: Run tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --all-targets --all-features
