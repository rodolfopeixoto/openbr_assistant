[package]
name = "openbr-desktop"
version = "2026.3.7"
description = "OpenBR Desktop Application"
authors = ["OpenBR Team"]
license = "MIT"
repository = "https://github.com/rodolfopeixoto/openbr_assistant"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "system-tray", "window-all", "notification-all", "global-shortcut-all", "process-exit", "process-relaunch"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.11", features = ["json"] }
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
open = "5.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
